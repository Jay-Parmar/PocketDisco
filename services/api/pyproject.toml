[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketdisco-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "greenlet==3.2.4; sys_platform == 'win32'",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<7",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.21,<1", "httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs PostgreSQL and Redis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
