name: Phase 0 checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test sync analysis
        run: python -m unittest discover -s tools/sync_analysis/tests -v
      - name: Test Phase 0 coordinator
        run: python -m unittest discover -s tools/phase0_coordinator/tests -v

  android:
    name: Android experiment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Run Android unit tests
        working-directory: experiments/android-phase0
        run: bash ./gradlew testDebugUnitTest
      - name: Run Android lint
        working-directory: experiments/android-phase0
        run: bash ./gradlew lintDebug
      - name: Assemble debug APK
        working-directory: experiments/android-phase0
        run: bash ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase0-debug-apk
          path: experiments/android-phase0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
